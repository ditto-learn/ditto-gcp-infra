name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-apply.yml"
  workflow_dispatch:

jobs:
  apply-test:
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_TEST }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT_TEST }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.0

      - name: Terraform init
        run: |
          terraform -chdir=terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET_TEST }}" \
            -backend-config="prefix=terraform/test"

      - name: Terraform apply (test)
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD_TEST }}
          TF_VAR_google_genai_api_key: ${{ secrets.TF_VAR_GOOGLE_GENAI_API_KEY_TEST }}
        run: terraform -chdir=terraform apply -auto-approve -input=false -var-file=environments/test.tfvars

  apply-prod:
    runs-on: ubuntu-latest
    needs: apply-test
    environment: prod
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_PROD }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT_PROD }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.0

      - name: Terraform init
        run: |
          terraform -chdir=terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET_PROD }}" \
            -backend-config="prefix=terraform/prod"

      - name: Terraform apply (prod)
        env:
          TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD_PROD }}
          TF_VAR_google_genai_api_key: ${{ secrets.TF_VAR_GOOGLE_GENAI_API_KEY_PROD }}
        run: terraform -chdir=terraform apply -auto-approve -input=false -var-file=environments/prod.tfvars
