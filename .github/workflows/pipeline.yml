name: Infra Pipeline

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/pipeline.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "terraform/**"
      - ".github/workflows/pipeline.yml"
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Git ref to apply to production for rollback/re-apply, e.g. v1.2.3 or a commit SHA"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: infra-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt-validate:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [platform, database, runtime]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.0

      - name: Terraform fmt
        run: terraform fmt -check -recursive terraform

      - name: Terraform init without backend
        run: terraform -chdir=terraform/${{ matrix.component }} init -backend=false

      - name: Terraform validate
        run: terraform -chdir=terraform/${{ matrix.component }} validate

  plan:
    if: github.event_name == 'pull_request'
    needs: fmt-validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        component: [platform, database, runtime]
        environment: [test, prod]
    env:
      TF_STATE_BUCKET_TEST: ${{ secrets.TF_STATE_BUCKET_TEST }}
      TF_STATE_BUCKET_PROD: ${{ secrets.TF_STATE_BUCKET_PROD }}
      TF_VAR_google_genai_api_key: ${{ matrix.environment == 'test' && secrets.TF_VAR_GOOGLE_GENAI_API_KEY_TEST || secrets.TF_VAR_GOOGLE_GENAI_API_KEY_PROD }}
      TF_VAR_stripe_secret_key: ${{ matrix.environment == 'test' && secrets.TF_VAR_STRIPE_SECRET_KEY_TEST || secrets.TF_VAR_STRIPE_SECRET_KEY_PROD }}
      TF_VAR_stripe_webhook_secret: ${{ matrix.environment == 'test' && secrets.TF_VAR_STRIPE_WEBHOOK_SECRET_TEST || secrets.TF_VAR_STRIPE_WEBHOOK_SECRET_PROD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.0
          terraform_wrapper: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ matrix.environment == 'test' && secrets.GCP_WIF_PROVIDER_TEST || secrets.GCP_WIF_PROVIDER_PROD }}
          service_account: ${{ matrix.environment == 'test' && secrets.GCP_WIF_SERVICE_ACCOUNT_TEST || secrets.GCP_WIF_SERVICE_ACCOUNT_PROD }}

      - name: Terraform plan
        run: |
          set +e
          ./terraform/scripts/tf-stack.sh "${{ matrix.component }}" "${{ matrix.environment }}" plan 2>&1 | tee plan-output.txt
          echo "${PIPESTATUS[0]}" > plan-status.txt

      - name: Comment plan on PR
        if: always()
        uses: actions/github-script@v7
        env:
          COMPONENT: ${{ matrix.component }}
          TARGET_ENV: ${{ matrix.environment }}
        with:
          script: |
            const fs = require("fs");
            const component = process.env.COMPONENT;
            const targetEnv = process.env.TARGET_ENV;
            const marker = `<!-- terraform-plan:${component}:${targetEnv} -->`;
            const output = fs.existsSync("plan-output.txt")
              ? fs.readFileSync("plan-output.txt", "utf8").slice(-60000)
              : "No plan output was produced.";
            const body = `${marker}
            ### Terraform plan: ${component} / ${targetEnv}

            \`\`\`
            ${output}
            \`\`\``;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((comment) => comment.user.type === "Bot" && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail if plan failed
        run: test "$(cat plan-status.txt)" = "0"

  apply-test:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: fmt-validate
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: infra-apply-test
      cancel-in-progress: true
    env:
      TF_STATE_BUCKET_TEST: ${{ secrets.TF_STATE_BUCKET_TEST }}
      TF_VAR_google_genai_api_key: ${{ secrets.TF_VAR_GOOGLE_GENAI_API_KEY }}
      TF_VAR_stripe_secret_key: ${{ secrets.TF_VAR_STRIPE_SECRET_KEY }}
      TF_VAR_stripe_webhook_secret: ${{ secrets.TF_VAR_STRIPE_WEBHOOK_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Apply platform
        run: ./terraform/scripts/tf-stack.sh platform test apply

      - name: Apply database
        run: ./terraform/scripts/tf-stack.sh database test apply

      - name: Apply runtime
        run: ./terraform/scripts/tf-stack.sh runtime test apply

  apply-prod-tag:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: fmt-validate
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: infra-apply-prod
      cancel-in-progress: false
    env:
      TF_STATE_BUCKET_PROD: ${{ secrets.TF_STATE_BUCKET_PROD }}
      TF_VAR_google_genai_api_key: ${{ secrets.TF_VAR_GOOGLE_GENAI_API_KEY }}
      TF_VAR_stripe_secret_key: ${{ secrets.TF_VAR_STRIPE_SECRET_KEY }}
      TF_VAR_stripe_webhook_secret: ${{ secrets.TF_VAR_STRIPE_WEBHOOK_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Apply platform
        run: ./terraform/scripts/tf-stack.sh platform prod apply

      - name: Apply database
        run: ./terraform/scripts/tf-stack.sh database prod apply

      - name: Apply runtime
        run: ./terraform/scripts/tf-stack.sh runtime prod apply

  apply-prod-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: infra-apply-prod
      cancel-in-progress: false
    env:
      TF_STATE_BUCKET_PROD: ${{ secrets.TF_STATE_BUCKET_PROD }}
      TF_VAR_google_genai_api_key: ${{ secrets.TF_VAR_GOOGLE_GENAI_API_KEY }}
      TF_VAR_stripe_secret_key: ${{ secrets.TF_VAR_STRIPE_SECRET_KEY }}
      TF_VAR_stripe_webhook_secret: ${{ secrets.TF_VAR_STRIPE_WEBHOOK_SECRET }}
    steps:
      - name: Checkout requested release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Apply platform
        run: ./terraform/scripts/tf-stack.sh platform prod apply

      - name: Apply database
        run: ./terraform/scripts/tf-stack.sh database prod apply

      - name: Apply runtime
        run: ./terraform/scripts/tf-stack.sh runtime prod apply
