name: Terraform Apply

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-apply.yml"
  workflow_dispatch:

jobs:
  apply-test:
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.0

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_TEST }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT_TEST }}

      - name: Apply platform (test)
        env:
          TF_STATE_BUCKET_TEST: ${{ secrets.TF_STATE_BUCKET_TEST }}
          TF_VAR_google_genai_api_key: ${{ secrets.TF_VAR_GOOGLE_GENAI_API_KEY_TEST }}
          TF_VAR_stripe_secret_key: ${{ secrets.TF_VAR_STRIPE_SECRET_KEY_TEST }}
          TF_VAR_stripe_webhook_secret: ${{ secrets.TF_VAR_STRIPE_WEBHOOK_SECRET_TEST }}
        run: ./terraform/scripts/tf-stack.sh platform test apply

      - name: Apply database (test)
        env:
          TF_STATE_BUCKET_TEST: ${{ secrets.TF_STATE_BUCKET_TEST }}
        run: ./terraform/scripts/tf-stack.sh database test apply

      - name: Apply runtime (test)
        env:
          TF_STATE_BUCKET_TEST: ${{ secrets.TF_STATE_BUCKET_TEST }}
        run: ./terraform/scripts/tf-stack.sh runtime test apply

  apply-prod:
    runs-on: ubuntu-latest
    needs: apply-test
    environment: prod
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.0

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER_PROD }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT_PROD }}

      - name: Apply platform (prod)
        env:
          TF_STATE_BUCKET_PROD: ${{ secrets.TF_STATE_BUCKET_PROD }}
          TF_VAR_google_genai_api_key: ${{ secrets.TF_VAR_GOOGLE_GENAI_API_KEY_PROD }}
          TF_VAR_stripe_secret_key: ${{ secrets.TF_VAR_STRIPE_SECRET_KEY_PROD }}
          TF_VAR_stripe_webhook_secret: ${{ secrets.TF_VAR_STRIPE_WEBHOOK_SECRET_PROD }}
        run: ./terraform/scripts/tf-stack.sh platform prod apply

      - name: Apply database (prod)
        env:
          TF_STATE_BUCKET_PROD: ${{ secrets.TF_STATE_BUCKET_PROD }}
        run: ./terraform/scripts/tf-stack.sh database prod apply

      - name: Apply runtime (prod)
        env:
          TF_STATE_BUCKET_PROD: ${{ secrets.TF_STATE_BUCKET_PROD }}
        run: ./terraform/scripts/tf-stack.sh runtime prod apply
